services:
  postgres:
    image: postgres:15-alpine
    container_name: wallet_transfer_postgres
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet_transfer
    ports:
      - "5433:5432"
    volumes:
      - wallet_transfer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet_transfer"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  wallet_transfer_pgdata:
